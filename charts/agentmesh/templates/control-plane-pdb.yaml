{{- /*
One replica gets no budget: maxUnavailable 1 would allow evicting it anyway.
*/ -}}
{{- if gt (int .Values.controlPlane.replicaCount) 1 -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "agentmesh.fullname" . }}-control-plane
  labels:
    {{- include "agentmesh.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  {{- if semverCompare ">=1.27-0" .Capabilities.KubeVersion.Version }}
  # An unhealthy pod never blocks draining its node, even with the budget spent.
  unhealthyPodEvictionPolicy: AlwaysAllow
  {{- end }}
  selector:
    matchLabels:
      app: {{ include "agentmesh.fullname" . }}-control-plane
{{- end }}
