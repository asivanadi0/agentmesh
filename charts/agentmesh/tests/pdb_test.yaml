suite: control plane pod disruption budget
templates:
  - templates/control-plane-pdb.yaml
release:
  # collapses fullname to "agentmesh" (see _helpers.tpl)
  name: agentmesh
capabilities:
  majorVersion: 1
  minorVersion: 30
tests:
  - it: default values give the control plane a maxUnavailable 1 PDB on its pods
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.maxUnavailable
          value: 1
      - notExists:
          path: spec.minAvailable
      - equal:
          path: spec.unhealthyPodEvictionPolicy
          value: AlwaysAllow
      - equal:
          path: spec.selector.matchLabels.app
          value: agentmesh-control-plane

  - it: a single control plane replica gets no PDB
    set:
      controlPlane.replicaCount: 1
    asserts:
      - hasDocuments:
          count: 0

  - it: Kubernetes before 1.27 gets no unhealthyPodEvictionPolicy
    capabilities:
      majorVersion: 1
      minorVersion: 26
    asserts:
      - hasDocuments:
          count: 1
      - notExists:
          path: spec.unhealthyPodEvictionPolicy
